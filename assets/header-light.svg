<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Aýhan Gurbanow, AI Engineer and Software Architect">
<style>@font-face{font-family:'BG';font-weight:700;src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'BG';font-weight:500;src:url(data:font/ttf;base64,) format('truetype');}
text{font-family:'BG','Segoe UI',Helvetica,Arial,sans-serif}
.n{font-size:84px;font-weight:700;letter-spacing:-2.4px}
.r{font-size:32px;font-weight:500;letter-spacing:-0.4px}
.f{font-size:22px;font-weight:500}
.b{font-size:34px;font-weight:700;letter-spacing:-0.6px;text-anchor:middle}
.bn{font-size:19px;font-weight:500;text-anchor:middle}
.node,.edge,.arrive,.b,.bn{transform-box:fill-box}
.node{transform-origin:50% 50%;animation:appear .5s cubic-bezier(.22,1,.36,1) both}
.n1{animation-delay:.1s}
.n2{animation-delay:.25s}
.edge{transform-origin:0 50%;animation:draw .6s cubic-bezier(.65,0,.35,1) .55s both}
.arrive{transform-origin:50% 50%;animation:settle .35s cubic-bezier(.22,1,.36,1) 1.1s both}
.b{animation:rise .45s cubic-bezier(.22,1,.36,1) 1.2s both}
.bn{animation:rise .45s cubic-bezier(.22,1,.36,1) 1.32s both}
@keyframes appear{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes settle{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.node,.edge,.arrive,.b,.bn{animation:none}}
</style>
<g fill="#0A7A3E"><rect class="edge" x="934" y="88.5" width="236" height="7" rx="3.5"/><circle class="node n1" cx="934" cy="92" r="22"/><g class="arrive"><circle class="node n2" cx="1170" cy="92" r="22"/></g></g>
<text x="0" y="112" class="n" fill="#1F2328">A<tspan fill="#0A7A3E">ý</tspan>han Gurbanow</text>
<text x="2" y="160" class="r" fill="#3D444D">AI Engineer &amp; Software Architect</text>
<text x="2" y="196" class="f" fill="#59636E">Turkmen language AI · Automation · Control panels · Web platforms</text>
<text x="1052" y="160" class="b" fill="#1F2328">Be Max</text>
<text x="1052" y="196" class="bn" fill="#59636E">personal AI council · in progress</text>
</svg>
